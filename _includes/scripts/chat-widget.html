{%- if site.profile_qa.enabled -%}
<!-- Profile QA chat widget — talks to the open-source RAG backend -->
<style>
  .pqa-fab {
    position: fixed; right: 20px; bottom: 20px; z-index: 1050;
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background: var(--global-theme-color, #b509ac); color: #fff;
    font-size: 24px; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center;
  }
  .pqa-panel {
    position: fixed; right: 20px; bottom: 88px; z-index: 1050;
    width: min(380px, calc(100vw - 40px)); height: min(520px, calc(100vh - 140px));
    background: var(--global-bg-color, #fff); color: var(--global-text-color, #111);
    border: 1px solid rgba(0,0,0,.12); border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
    display: none; flex-direction: column; overflow: hidden;
  }
  .pqa-panel.pqa-open { display: flex; }
  .pqa-head {
    padding: 12px 14px; font-weight: 600;
    background: var(--global-theme-color, #b509ac); color: #fff;
    display: flex; justify-content: space-between; align-items: center;
  }
  .pqa-head button { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
  .pqa-msgs { flex: 1; overflow-y: auto; padding: 12px; font-size: 14px; line-height: 1.45; }
  .pqa-msg { margin-bottom: 12px; white-space: pre-wrap; }
  .pqa-msg.pqa-user { text-align: right; }
  .pqa-bubble {
    display: inline-block; padding: 8px 12px; border-radius: 12px; max-width: 90%;
    text-align: left;
  }
  .pqa-user .pqa-bubble { background: var(--global-theme-color, #b509ac); color: #fff; }
  .pqa-bot .pqa-bubble { background: var(--global-code-bg-color, rgba(0,0,0,.06)); }
  .pqa-form { display: flex; border-top: 1px solid rgba(0,0,0,.12); }
  .pqa-form input {
    flex: 1; border: none; padding: 12px; font-size: 14px;
    background: var(--global-bg-color, #fff); color: var(--global-text-color, #111);
  }
  .pqa-form input:focus { outline: none; }
  .pqa-form button {
    border: none; background: var(--global-theme-color, #b509ac); color: #fff;
    padding: 0 16px; cursor: pointer;
  }
  .pqa-form button:disabled { opacity: .5; cursor: default; }
  .pqa-hint { font-size: 12px; opacity: .6; padding: 0 12px 8px; }
</style>

<button class="pqa-fab" id="pqa-fab" aria-label="Ask about Sabil">💬</button>
<div class="pqa-panel" id="pqa-panel" role="dialog" aria-label="Ask about Sabil">
  <div class="pqa-head">
    <span>Ask about Sabil</span>
    <button id="pqa-close" aria-label="Close">×</button>
  </div>
  <div class="pqa-msgs" id="pqa-msgs">
    <div class="pqa-msg pqa-bot"><span class="pqa-bubble">Hi! Ask me anything about Sabil's background, work, or research.</span></div>
  </div>
  <div class="pqa-hint">Answers are generated from this site's profile content.</div>
  <form class="pqa-form" id="pqa-form" autocomplete="off">
    <input id="pqa-input" type="text" placeholder="e.g. What does he work on?" maxlength="500" />
    <button type="submit" id="pqa-send">Send</button>
  </form>
</div>

<script>
  (function () {
    var ENDPOINT = {{ site.profile_qa.endpoint | jsonify }};
    var fab = document.getElementById("pqa-fab");
    var panel = document.getElementById("pqa-panel");
    var msgs = document.getElementById("pqa-msgs");
    var form = document.getElementById("pqa-form");
    var input = document.getElementById("pqa-input");
    var send = document.getElementById("pqa-send");

    function toggle(open) {
      panel.classList.toggle("pqa-open", open);
      if (open) input.focus();
    }
    fab.addEventListener("click", function () { toggle(!panel.classList.contains("pqa-open")); });
    document.getElementById("pqa-close").addEventListener("click", function () { toggle(false); });

    function addMsg(text, who) {
      var wrap = document.createElement("div");
      wrap.className = "pqa-msg pqa-" + who;
      var b = document.createElement("span");
      b.className = "pqa-bubble";
      b.textContent = text;             // textContent => no HTML injection
      wrap.appendChild(b);
      msgs.appendChild(wrap);
      msgs.scrollTop = msgs.scrollHeight;
      return b;
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var q = input.value.trim();
      if (!q) return;
      addMsg(q, "user");
      input.value = "";
      send.disabled = true;
      var thinking = addMsg("…", "bot");

      // the backend Space sleeps when idle; the first request wakes it (~30-60s).
      // after a short delay, reassure the user instead of showing a bare "…".
      var wake = setTimeout(function () {
        thinking.textContent = "Waking the assistant up — the first question "
          + "after a while can take ~30–60s…";
      }, 4000);

      // hard timeout so a cold/unreachable backend never hangs forever
      var controller = new AbortController();
      var timeout = setTimeout(function () { controller.abort(); }, 90000);

      fetch(ENDPOINT.replace(/\/$/, "") + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q }),
        signal: controller.signal,
      })
        .then(function (r) {
          if (r.status === 429) throw new Error("rate");
          if (!r.ok) throw new Error("http");
          return r.json();
        })
        .then(function (d) { thinking.textContent = d.answer || "(no answer)"; })
        .catch(function (err) {
          if (err && err.name === "AbortError") {
            thinking.textContent = "The assistant is taking too long to respond "
              + "(it may be waking up). Please try again in a moment.";
          } else if (err && err.message === "rate") {
            thinking.textContent = "You're sending messages a bit fast — "
              + "please wait a few seconds and try again.";
          } else {
            thinking.textContent = "Sorry — I couldn't reach the assistant right now.";
          }
        })
        .finally(function () {
          clearTimeout(wake);
          clearTimeout(timeout);
          send.disabled = false;
          msgs.scrollTop = msgs.scrollHeight;
        });
    });
  })();
</script>
{%- endif -%}
