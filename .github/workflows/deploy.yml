name: Build & deploy site

on:
  push:
    branches: [master]
  workflow_dispatch: {}      # allows manual "Run workflow"
  schedule:
    - cron: "0 6 * * 1"      # weekly (Mon 06:00 UTC) — refreshes auto-fetched repo data

# Official GitHub Pages deployment: the built site is uploaded as an artifact and
# published straight to Pages, so there is no gh-pages branch to write to.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deployment; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Data and privacy checks need no build, so run them first and fail fast.
      - run: npm run test:data

      # `pretest` builds the site, then the checks run against src/data and dist.
      # A failing test stops the job, so nothing broken reaches Pages.
      - run: npm test
        env:
          # used by src/pages/repositories.astro to raise the GitHub API rate limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # optional: unset means no analytics beacon is emitted
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
