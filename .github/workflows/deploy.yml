name: Build & deploy site

on:
  push:
    branches: [master]
  workflow_dispatch: {}      # allows manual "Run workflow"
  schedule:
    - cron: "0 6 * * 1"      # weekly (Mon 06:00 UTC) — refreshes auto-fetched repo data

permissions:
  contents: write            # to push the built site to gh-pages

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # used by src/pages/repositories.astro to raise the GitHub API rate limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
