name = "profile-qa-cf"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Browser origins allowed to call /chat (comma-separated). Change this to your
# own site when forking; the localhost entries work for any local dev server.
[vars]
ALLOWED_ORIGINS = "https://sabilmakbar.github.io,http://localhost:4321,http://127.0.0.1:4321"

# Workers AI binding — gives the Worker env.AI.run(model, input)
[ai]
binding = "AI"

# D1 (SQLite) binding — env.DB, used to log questions/answers for review.
[[d1_databases]]
binding = "DB"
database_name = "profile-qa-logs"
database_id = "861b964d-9b91-45b4-8c12-89152a5f0dc4"
