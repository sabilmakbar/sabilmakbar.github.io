[project]
name = "profile-qa-backend"
version = "0.1.0"
description = "Open-source RAG backend answering grounded questions about Salsabil Maulana Akbar's profile"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # piece 2 — embeddings + hybrid (dense + BM25) retrieval
    "sentence-transformers>=3.0",
    "numpy",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
# piece 3 — backend serving (added/installed when we build it)
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "llama-cpp-python>=0.3",
    "huggingface_hub>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ingest", "build_index"]
